name: YouTube Shorts Spor Otomasyonu

on:
  schedule:
    # 1) 08:00 TSİ (05:00 UTC) - Günün Spor Manşetleri (Detaylı Bülten)
    - cron: '55 4 * * *'
    # 2) 10:45 TSİ (07:45 UTC) - Futbolcu Biyografisi & Efsane Hikayeler
    - cron: '40 7 * * *'
    # 3) 13:30 TSİ (10:30 UTC) - Son Dakika Futbol & Transfer Gelişmesi
    - cron: '25 10 * * *'
    # 4) 16:15 TSİ (13:15 UTC) - Futbol Genel Kültürü ("Biliyor Muydunuz?")
    - cron: '10 13 * * *'
    # 5) 19:30 TSİ (16:30 UTC) - Maç Önü İstatistikleri & Form Analizi
    - cron: '25 16 * * *'
    # 6) 22:00 TSİ (19:00 UTC) - Günün Maç Sonu Analizi & Skor Özeti
    - cron: '55 18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Spor Shorts Kategorisi'
        required: true
        default: 'headlines'
        type: choice
        options:
          - headlines
          - biography
          - breaking
          - trivia
          - pre_match
          - post_match

jobs:
  publish-sports-shorts:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Istanbul
    steps:
      - name: Repo Kodlarını Çek
        uses: actions/checkout@v4

      - name: Python 3.12 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sistem Fontlarını, FFmpeg ve Kütüphaneleri Yükle
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install --quiet pillow edge-tts requests numpy google-api-python-client google-auth-oauthlib google-auth-httplib2 instagrapi

      - name: YouTube OAuth Anahtarını Hazırla
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          if [ -z "$YT_TOKEN_JSON" ]; then
            echo "[HATA] YT_TOKEN_JSON GitHub Secret bulunamadı!"
            exit 1
          fi
          printf '%s' "$YT_TOKEN_JSON" > youtube_token.json

      - name: Saate Göre Spor Shorts Videosunu Üret ve Yayınla
        env:
          FORCE_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            HOUR=$(date +%H)
            if [ "$HOUR" -lt 10 ]; then
              MODE="headlines"
            elif [ "$HOUR" -lt 12 ]; then
              MODE="biography"
            elif [ "$HOUR" -lt 15 ]; then
              MODE="breaking"
            elif [ "$HOUR" -lt 18 ]; then
              MODE="trivia"
            elif [ "$HOUR" -lt 21 ]; then
              MODE="pre_match"
            else
              MODE="post_match"
            fi
          fi

          echo "Aktif Spor Shorts Kategorisi: $MODE (Saat TSİ: $(date '+%H:%M'))"
          python youtube_sports_shorts.py --mode "$MODE" --upload
