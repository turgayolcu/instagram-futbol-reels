name: YouTube Shorts Saatlik Spor Otomasyonu

on:
  schedule:
    # Açık (explicit) tekil saat başı cron kayıtları: 08:00 - 24:00 TSİ (04:55 - 20:55 UTC)
    - cron: '55 4 * * *'
    - cron: '55 5 * * *'
    - cron: '55 6 * * *'
    - cron: '55 7 * * *'
    - cron: '55 8 * * *'
    - cron: '55 9 * * *'
    - cron: '55 10 * * *'
    - cron: '55 11 * * *'
    - cron: '55 12 * * *'
    - cron: '55 13 * * *'
    - cron: '55 14 * * *'
    - cron: '55 15 * * *'
    - cron: '55 16 * * *'
    - cron: '55 17 * * *'
    - cron: '55 18 * * *'
    - cron: '55 19 * * *'
    - cron: '55 20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Spor Shorts Kategorisi'
        required: true
        default: 'headlines'
        type: choice
        options:
          - headlines
          - biography
          - breaking
          - trivia
          - pre_match
          - post_match

jobs:
  publish-sports-shorts:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Istanbul
    steps:
      - name: Repo Kodlarını Çek
        uses: actions/checkout@v4

      - name: Python 3.12 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sistem Fontlarını, FFmpeg ve Kütüphaneleri Yükle
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install --quiet pillow edge-tts requests numpy google-api-python-client google-auth-oauthlib google-auth-httplib2 instagrapi

      - name: YouTube OAuth Anahtar Havuzunu Hazırla
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_TOKEN_JSON_2: ${{ secrets.YT_TOKEN_JSON_2 }}
          YT_TOKEN_JSON_3: ${{ secrets.YT_TOKEN_JSON_3 }}
        run: |
          if [ -z "$YT_TOKEN_JSON" ]; then
            echo "[HATA] YT_TOKEN_JSON GitHub Secret bulunamadı!"
            exit 1
          fi
          printf '%s' "$YT_TOKEN_JSON" > youtube_token.json
          if [ -n "$YT_TOKEN_JSON_2" ]; then
            printf '%s' "$YT_TOKEN_JSON_2" > youtube_token_2.json
          fi
          if [ -n "$YT_TOKEN_JSON_3" ]; then
            printf '%s' "$YT_TOKEN_JSON_3" > youtube_token_3.json
          fi

      - name: Saat Başına Göre Spor Shorts Videosunu Üret ve Yayınla
        env:
          FORCE_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            SLOT_HOUR=$(date -d "+10 minutes" +%H)
            case "$SLOT_HOUR" in
              08|12|20)
                MODE="headlines"
                ;;
              09|13|18)
                MODE="biography"
                ;;
              10|14|17|23)
                MODE="breaking"
                ;;
              11|16|21)
                MODE="trivia"
                ;;
              15|19)
                MODE="pre_match"
                ;;
              22|00|*)
                MODE="post_match"
                ;;
            esac
          fi

          echo "Aktif Spor Shorts Kategorisi: $MODE (Hedef Saat: $(date -d '+10 minutes' '+%H:00') TSİ)"
          python youtube_sports_shorts.py --mode "$MODE" --upload
