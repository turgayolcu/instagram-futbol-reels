name: Instagram Gunluk Futbol Reels Otomasyonu (DURDURULDU - Sadece Manuel)

on:
  # Otomatik zamanlayıcı (schedule / cron) tamamen kaldırıldı. Otomasyon durdurulmuştur.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Paylaşım Konsepti (vs = 09:00 VS Manşet, odds = 10:10 Bülten, last5 = 14:00 Son 5 Maç, coupon = 15:00 Kupon, results = 23:59 Sonuçlar)'
        required: true
        default: 'vs'
        type: choice
        options:
          - vs
          - odds
          - last5
          - coupon
          - results

jobs:
  publish-reels:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Istanbul
    steps:
      - name: Repo Kodlarını Çek
        uses: actions/checkout@v4

      - name: Python 3.12 ve FFmpeg Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sistem Fontlarını ve Kütüphaneleri Yükle
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install --quiet instagrapi pillow edge-tts gTTS requests numpy

      - name: Instagram Oturum ve Kimlik Bilgilerini Hazırla
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
        run: |
          printf "IG_USERNAME=%s\nIG_PASSWORD=%s\n" "$IG_USERNAME" "$IG_PASSWORD" > .env
          if [ -n "$IG_SESSION_JSON" ]; then
            printf '%s' "$IG_SESSION_JSON" > ig_session.json
          fi

      - name: Saate Göre Reels Üret ve Paylaş
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            SCHED="${{ github.event.schedule }}"
            case "$SCHED" in
              "45 5 * * *"|"2 6 * * *")
                MODE="vs"
                ;;
              "55 6 * * *"|"10 7 * * *")
                MODE="odds"
                ;;
              "45 10 * * *"|"0 11 * * *")
                MODE="last5"
                ;;
              "45 11 * * *"|"0 12 * * *")
                MODE="coupon"
                ;;
              *)
                MODE="results"
                ;;
            esac
          fi

          echo "Aktif Otomasyon Modu: $MODE"

          if [ "$MODE" = "vs" ]; then
            python auto_manset_reels.py --mode vs --upload --interval 900
          elif [ "$MODE" = "last5" ]; then
            python auto_manset_reels.py --mode last5 --upload --interval 900
          else
            python cloud_fetcher.py
            python motion_reels.py --mode "$MODE" --category spor
            if [ "$MODE" = "odds" ]; then
              CAPTION="Günün Maçları & Oranlar! #iddaa #futbol #süperlig #avrupaligi #şampiyonlarligi"
            elif [ "$MODE" = "coupon" ]; then
              CAPTION="Günün Banko Kuponu Hazır! #iddaa #bankokupon #futbol #tahmin"
            else
              CAPTION="Günün Biten Maç Sonuçları! #iddaa #maçsonuçları #futbol #süperlig"
            fi
            python upload_instagram.py "output/reels_${MODE}_latest.mp4" "$CAPTION"
          fi
