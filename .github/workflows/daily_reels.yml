name: YouTube Gunluk Futbol Shorts Otomasyonu

on:
  schedule:
    # 1) Saat 09:00 TSİ - VS Temalı Manşet Shorts (En fazla 2 dev maç, 15 dk arayla)
    - cron: '45 5 * * *'
    - cron: '2 6 * * *'
    # 2) Saat 10:10 TSİ - Günün Maçları & İddaa Oranları Shorts
    - cron: '55 6 * * *'
    - cron: '10 7 * * *'
    # 3) Saat 14:00 TSİ - Takım Armalı Son 5 Maç Karnesi Shorts
    - cron: '45 10 * * *'
    - cron: '0 11 * * *'
    # 4) Saat 15:00 TSİ - Günün Banko Kuponu Shorts
    - cron: '45 11 * * *'
    - cron: '0 12 * * *'
    # 5) Saat 23:59 TSİ - Günün Biten Maç Sonuçları Shorts
    - cron: '42 20 * * *'
    - cron: '59 20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Paylaşım Konsepti (vs = 09:00 VS Manşet, odds = 10:10 Bülten, last5 = 14:00 Son 5 Maç, coupon = 15:00 Kupon, results = 23:59 Sonuçlar)'
        required: true
        default: 'odds'
        type: choice
        options:
          - vs
          - odds
          - last5
          - coupon
          - results

jobs:
  publish-shorts:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Istanbul
    steps:
      - name: Repo Kodlarını Çek
        uses: actions/checkout@v4

      - name: Python 3.12 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sistem Fontlarını, FFmpeg ve YouTube API Kütüphanelerini Yükle
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install --quiet pillow edge-tts gTTS requests numpy google-api-python-client google-auth-oauthlib google-auth-httplib2 instagrapi

      - name: YouTube OAuth Anahtarını Hazırla
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          if [ -z "$YT_TOKEN_JSON" ]; then
            echo "[HATA] YT_TOKEN_JSON GitHub Secret bulunamadı!"
            exit 1
          fi
          printf '%s' "$YT_TOKEN_JSON" > youtube_token.json

      - name: Saate Göre YouTube Shorts Üret ve Yayınla
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            SCHED="${{ github.event.schedule }}"
            case "$SCHED" in
              "45 5 * * *"|"2 6 * * *")
                MODE="vs"
                ;;
              "55 6 * * *"|"10 7 * * *")
                MODE="odds"
                ;;
              "45 10 * * *"|"0 11 * * *")
                MODE="last5"
                ;;
              "45 11 * * *"|"0 12 * * *")
                MODE="coupon"
                ;;
              *)
                MODE="results"
                ;;
            esac
          fi

          echo "Aktif YouTube Shorts Otomasyon Modu: $MODE"

          if [ "$MODE" = "vs" ]; then
            python auto_manset_reels.py --mode vs --platform youtube --upload --interval 900
          elif [ "$MODE" = "last5" ]; then
            python auto_manset_reels.py --mode last5 --platform youtube --upload --interval 900
          else
            python cloud_fetcher.py
            python motion_reels.py --mode "$MODE" --category spor
            if [ "$MODE" = "odds" ]; then
              CAPTION="🔥 Günün Maçları & İddaa Oranları! ⚽ #Shorts #iddaa #futbol #süperlig #avrupaligi"
            elif [ "$MODE" = "coupon" ]; then
              CAPTION="🎯 Günün Banko Kuponu Hazır! ⚽🔥 #Shorts #iddaa #bankokupon #futbol #tahmin"
            else
              CAPTION="🏁 Günün Biten Maç Sonuçları! ⚽ #Shorts #iddaa #maçsonuçları #futbol #süperlig"
            fi
            python upload_youtube.py "output/reels_${MODE}_latest.mp4" "$CAPTION"
          fi
