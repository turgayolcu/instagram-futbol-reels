name: Instagram Gunluk Futbol Reels Otomasyonu

on:
  schedule:
    # Sabah ~10:00 TSİ - Her gün Günün Maçları & Oranlar (GitHub kuyruk gecikmesine karşı erken + yedek tetikleyici; mükerrer korumalı)
    - cron: '35 6 * * *'
    - cron: '2 7 * * *'
    # Öğlen ~15:00 TSİ - Her gün Günün Banko Kuponu
    - cron: '40 11 * * *'
    - cron: '2 12 * * *'
    # Hafta İçi ~23:59 TSİ - Günün Biten Maç Sonuçları
    - cron: '35 20 * * 1-5'
    - cron: '59 20 * * 1-5'
    # Hafta Sonu ~22:30 TSİ - Günün Biten Maç Sonuçları
    - cron: '10 19 * * 0,6'
    - cron: '30 19 * * 0,6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Paylaşım Konsepti (odds = Sabah Bülten, coupon = Öğlen Kupon, results = Akşam Sonuçlar)'
        required: true
        default: 'odds'
        type: choice
        options:
          - odds
          - coupon
          - results

jobs:
  publish-reels:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Istanbul
    steps:
      - name: Repo Kodlarını Çek
        uses: actions/checkout@v4

      - name: Python 3.12 ve FFmpeg Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sistem Fontlarını ve Kütüphaneleri Yükle
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install --quiet instagrapi pillow edge-tts gTTS requests

      - name: Instagram Oturum ve Kimlik Bilgilerini Hazırla
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
        run: |
          printf "IG_USERNAME=%s\nIG_PASSWORD=%s\n" "$IG_USERNAME" "$IG_PASSWORD" > .env
          if [ -n "$IG_SESSION_JSON" ]; then
            printf '%s' "$IG_SESSION_JSON" > ig_session.json
          fi

      - name: Günün Güncel Maçlarını, Oranlarını ve Sonuçlarını Çek
        run: python cloud_fetcher.py

      - name: Saate Göre Motion Graphics Reels Üret ve Paylaş
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            SCHED="${{ github.event.schedule }}"
            case "$SCHED" in
              "35 6 * * *"|"2 7 * * *")
                MODE="odds"
                ;;
              "40 11 * * *"|"2 12 * * *")
                MODE="coupon"
                ;;
              *)
                MODE="results"
                ;;
            esac
          fi

          python motion_reels.py --mode "$MODE" --category spor

          if [ "$MODE" = "odds" ]; then
            CAPTION="Günün Maçları & Oranlar! #iddaa #futbol #süperlig #avrupaligi #şampiyonlarligi"
          elif [ "$MODE" = "coupon" ]; then
            CAPTION="Günün Banko Kuponu Hazır! #iddaa #bankokupon #futbol #tahmin"
          else
            CAPTION="Günün Biten Maç Sonuçları! #iddaa #maçsonuçları #futbol #süperlig"
          fi

          python upload_instagram.py "output/reels_${MODE}_latest.mp4" "$CAPTION"
