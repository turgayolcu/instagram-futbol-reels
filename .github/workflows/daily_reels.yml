name: YouTube Spor Gundemi Shorts Otomasyonu

on:
  schedule:
    # 1) Saat 08:00 TSİ - Günün Spor Manşetleri
    - cron: '48 4 * * *'
    - cron: '2 5 * * *'
    # 2) Saat 10:45 TSİ - Futbolcu Biyografisi & Hikayesi
    - cron: '35 7 * * *'
    - cron: '48 7 * * *'
    # 3) Saat 13:30 TSİ - Son Dakika Futbol & Transfer Gelişmesi
    - cron: '20 10 * * *'
    - cron: '33 10 * * *'
    # 4) Saat 16:15 TSİ - Futbol Genel Kültürü ("Biliyor Muydunuz?")
    - cron: '5 13 * * *'
    - cron: '18 13 * * *'
    # 5) Saat 19:00 TSİ - Maç Önü İstatistikleri & Form Analizi
    - cron: '48 15 * * *'
    - cron: '2 16 * * *'
    # 6) Saat 22:00 TSİ - Günün Maç Sonu Analizi & Skor Özeti
    - cron: '48 18 * * *'
    - cron: '2 19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Spor Shorts Kategorisi'
        required: true
        default: 'headlines'
        type: choice
        options:
          - headlines
          - biography
          - breaking
          - trivia
          - pre_match
          - post_match

jobs:
  publish-sports-shorts:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Istanbul
    steps:
      - name: Repo Kodlarını Çek
        uses: actions/checkout@v4

      - name: Python 3.12 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sistem Fontlarını, FFmpeg ve Kütüphaneleri Yükle
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install --quiet pillow edge-tts requests numpy google-api-python-client google-auth-oauthlib google-auth-httplib2 instagrapi

      - name: YouTube OAuth Anahtarını Hazırla
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          if [ -z "$YT_TOKEN_JSON" ]; then
            echo "[HATA] YT_TOKEN_JSON GitHub Secret bulunamadı!"
            exit 1
          fi
          printf '%s' "$YT_TOKEN_JSON" > youtube_token.json

      - name: Saate Göre Spor Shorts Videosunu Üret ve Yayınla
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            SCHED="${{ github.event.schedule }}"
            case "$SCHED" in
              "48 4 * * *"|"2 5 * * *")
                MODE="headlines"
                ;;
              "35 7 * * *"|"48 7 * * *")
                MODE="biography"
                ;;
              "20 10 * * *"|"33 10 * * *")
                MODE="breaking"
                ;;
              "5 13 * * *"|"18 13 * * *")
                MODE="trivia"
                ;;
              "48 15 * * *"|"2 16 * * *")
                MODE="pre_match"
                ;;
              *)
                MODE="post_match"
                ;;
            esac
          fi

          echo "Aktif Spor Shorts Kategorisi: $MODE"
          python youtube_sports_shorts.py --mode "$MODE" --upload
